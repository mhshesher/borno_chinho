<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Annotation Tool</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- Apply the saved theme before first paint so there is no flash -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {
                /* localStorage unavailable (private mode, blocked cookies) - stay on light */
            }
        })();
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- Main Container -->
    <div class="app-container">
        <!-- Left Sidebar - Tools -->
        <aside class="sidebar">
            <div class="logo">🎨</div>
            
            <nav class="tool-nav">
                <button class="tool-btn active" id="selectTool" title="Select Tool">
                    <i data-lucide="move"></i>
                </button>
            </nav>

            <div class="sidebar-spacer"></div>

            <div class="sidebar-actions">
                <!-- upload moved to top toolbar -->
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Toolbar -->
            <header class="toolbar">
                <div class="toolbar-left">
                    <h1 class="app-title">Image Annotation Tool</h1>
                    <div class="divider"></div>
                    <span class="file-name" id="fileName">No file loaded</span>
                </div>

                <div class="toolbar-right">
                    <!-- Image upload (moved from left sidebar) -->
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                    <button class="small-btn" id="uploadImageBtn" title="Upload Image" onclick="document.getElementById('fileInput').click()">
                        <i data-lucide="upload"></i>
                        Image
                    </button>
                    <button class="icon-btn" id="zoomOutBtn" onclick="zoomOut()" disabled>
                        <i data-lucide="zoom-out"></i>
                    </button>
                    <span class="zoom-display" id="zoomLevel">100%</span>
                    <button class="icon-btn" id="zoomInBtn" onclick="zoomIn()" disabled>
                        <i data-lucide="zoom-in"></i>
                    </button>
                    <button class="icon-btn" id="resetBtn" onclick="resetZoom()" disabled>
                        <i data-lucide="rotate-ccw"></i>
                    </button>
                    <div class="divider"></div>
                    <button class="icon-btn" id="themeToggleBtn" title="Toggle theme" onclick="toggleTheme()">
                        <i data-lucide="moon" class="theme-icon-light"></i>
                        <i data-lucide="sun" class="theme-icon-dark"></i>
                    </button>
                    <div class="divider"></div>
                    <button class="icon-btn danger" id="clearBtn" onclick="clearRectangles()" disabled>
                        <i data-lucide="trash-2"></i>
                    </button>
                </div>
            </header>

            <!-- Canvas Area -->
            <div class="canvas-area">
                <div class="canvas-wrapper" id="canvasWrapper">
                    <div class="placeholder" id="imagePlaceholder">
                        <i data-lucide="image" style="width: 64px; height: 64px; stroke-width: 1.5;"></i>
                        <p>Upload an image to start annotating</p>
                    </div>
                    <canvas id="canvas"></canvas>
                </div>
            </div>
        </main>

        <!-- Right Sidebar - Annotations -->
        <aside class="right-sidebar">
            <!-- Coordinates Section -->
            <section class="panel" id="coordinatePanel">
                <div class="panel-header-row">
                    <h2 class="panel-title">Selected Rectangle</h2>
                    <div class="panel-actions">
                        <button class="small-btn" id="closeCoordinatesBtn" title="Close" onclick="closeCoordinatesPanel()">
                            <i data-lucide="x"></i>
                        </button>
                    </div>
                </div>
                <div class="coordinates-display" id="coordinatesDisplay">
                    <div class="coord-empty">
                        <p>No rectangle selected</p>
                    </div>
                </div>
            </section>

            <!-- JSON Editor -->
            <section class="panel json-panel">
                <div class="panel-header-row">
                    <h2 class="panel-title">JSON Editor</h2>
                    <div class="panel-actions">
                        <input type="file" id="jsonFileInput" accept=".json" style="display: none;">
                        <button class="small-btn" onclick="document.getElementById('jsonFileInput').click()">
                            <i data-lucide="upload"></i>
                            Load
                        </button>
                        <button class="icon-btn" title="JSON Zoom Out" id="jsonZoomOutBtn" onclick="zoomJsonOut()">
                            <i data-lucide="zoom-out"></i>
                        </button>
                        <button class="icon-btn" title="JSON Zoom In" id="jsonZoomInBtn" onclick="zoomJsonIn()">
                            <i data-lucide="zoom-in"></i>
                        </button>
                        <button class="icon-btn" title="Reset JSON Zoom" id="jsonResetBtn" onclick="resetJsonZoom()">
                            <i data-lucide="rotate-ccw"></i>
                        </button>
                        <div class="divider"></div>
                        <div style="display:flex;align-items:center;gap:8px;padding-left:6px;">
                            <span class="zoom-display" id="jsonZoomLevel" style="min-width:50px;">100%</span>
                        </div>
                        <button class="small-btn primary" id="saveJsonBtn" onclick="saveJSON()">
                            <i data-lucide="save"></i>
                            Save
                        </button>
                    </div>
                </div>
                
                <!-- Find and Replace -->
                <div class="find-replace-container" id="findReplaceContainer" style="display: none;">
                    <div class="find-replace-row">
                        <input type="text" id="findInput" placeholder="Find..." class="find-replace-input">
                        <button class="find-replace-btn" onclick="findNext()" title="Find Next">
                            <i data-lucide="arrow-down"></i>
                        </button>
                        <button class="find-replace-btn" onclick="findPrev()" title="Find Previous">
                            <i data-lucide="arrow-up"></i>
                        </button>
                    </div>
                    <div class="find-replace-row">
                        <input type="text" id="replaceInput" placeholder="Replace..." class="find-replace-input">
                        <button class="find-replace-btn" onclick="replaceOne()" title="Replace">
                            <i data-lucide="replace"></i>
                        </button>
                        <button class="find-replace-btn" onclick="replaceAll()" title="Replace All">
                            <i data-lucide="replace-all"></i>
                        </button>
                        <button class="find-replace-btn close-btn" onclick="closeFindReplace()" title="Close">
                            <i data-lucide="x"></i>
                        </button>
                    </div>
                    <div class="find-counter" id="findCounter"></div>
                </div>
                
                <textarea id="jsonEditor" placeholder="JSON annotations will appear here..."></textarea>
            </section>
        </aside>
    </div>

    <script src="/static/script.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
