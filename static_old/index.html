<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Annotation Tool</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="header">
        <h1>🎨 Image Annotation Tool</h1>
        <div class="zoom-info" id="zoomLevel">Zoom: 100%</div>
    </div>
    
    <div class="main-container">
        <!-- Left Panel: Image -->
        <div class="left-panel">
            <div class="panel-header">
                <span>📷 Image</span>
                <div class="panel-controls">
                    <input type="file" id="fileInput" accept="image/*">
                    <button class="btn-small" onclick="document.getElementById('fileInput').click()">Upload Image</button>
                    <button class="btn-small" id="zoomInBtn" onclick="zoomIn()" disabled>Zoom In</button>
                    <button class="btn-small" id="zoomOutBtn" onclick="zoomOut()" disabled>Zoom Out</button>
                    <button class="btn-small" id="resetBtn" onclick="resetZoom()" disabled>Reset</button>
                    <button class="btn-small" id="clearBtn" onclick="clearRectangles()" disabled>Clear</button>
                </div>
                <div class="coordinates-panel" id="coordPanel">
                    <div style="color: #333; font-weight: bold; margin-bottom: 10px;">📍 Rectangle Coordinates:</div>
                    <div id="coordList">No rectangles drawn yet.</div>
                </div>
            </div>
            
            <div class="canvas-wrapper" id="canvasWrapper">
                <div class="placeholder" id="imagePlaceholder">Please upload an image</div>
                <canvas id="canvas"></canvas>
            </div>
        </div>
        
        <!-- Right Panel: JSON -->
        <div class="right-panel">
            <div class="panel-header">
                <span>📄 Annotations</span>
                <div class="panel-controls">
                    <input type="file" id="jsonFileInput" accept=".json">
                    <button class="btn-small" onclick="document.getElementById('jsonFileInput').click()">Upload JSON</button>
                    <button class="btn-small" id="saveJsonBtn" onclick="saveJSON()">Save JSON</button>
                </div>
            </div>
            
            <div class="json-wrapper">
                <textarea id="jsonEditor" placeholder="JSON annotations will appear here...
You can edit the JSON directly and save it."></textarea>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
